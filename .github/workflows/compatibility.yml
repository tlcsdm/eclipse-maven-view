name: Eclipse Version Compatibility

on:
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-targets:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
    - uses: actions/checkout@v7
    - name: Discover target files
      id: targets
      shell: bash
      run: |
        python - <<'PY'
        import json
        import os
        from pathlib import Path

        targets = sorted(path.stem for path in Path("targets").glob("*.target"))
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            print(f"targets={json.dumps(targets)}", file=output)
        PY

  compatibility:
    needs: discover-targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover-targets.outputs.targets) }}
    runs-on: windows-latest
    name: Eclipse ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'
      - name: Build with Maven against Eclipse ${{ matrix.target }}
        # Plugin is currently JavaSE-17, so 2025-03+ targets (with JavaSE-21 IUs) disable EE constraints here.
        # If the plugin baseline is upgraded to JavaSE-21, this split can be removed and EE constraints can stay enabled.
        run: mvn -B clean verify -ntp -DskipTests "-Dtarget.platform.file=targets/${{ matrix.target }}.target" "-Dtarget.resolve.with.ee.constraints=${{ startsWith(matrix.target, '2024-') && matrix.target != '2024-12' && 'true' || 'false' }}"
